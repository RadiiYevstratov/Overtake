[project]
name = "overtake-api"
version = "1.0.0"
description = "Overtake — rival-aware decision engine for FPL mini-leagues"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "httpx>=0.28",
    "numpy>=2.1",
    "structlog>=24.4",
    "stripe>=11.3",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.119",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
    "respx>=0.22",
    "pip-audit>=2.7",
]

[project.scripts]
overtake-api = "overtake.main:run"
overtake-worker = "overtake.workers.runner:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["overtake*"]

[tool.setuptools.package-data]
overtake = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"overtake/engine/*" = ["S311"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = false
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy overtake

      - name: Tests
        run: pytest -q --cov=overtake --cov-report=term-missing

      # The migration must produce exactly the schema the models describe, and
      # it must apply cleanly to a real PostgreSQL rather than only to SQLite.
      - name: Migration dry-run (PostgreSQL)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/overtake_ci
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-that-is-long-enough-for-validation
        run: alembic upgrade head

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: overtake_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  security:
    name: API — dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit --strict --ignore-vuln GHSA-none-placeholder || pip-audit

  web:
    name: Web — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high || true

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install API
        working-directory: api
        run: pip install -e ".[dev]"

      - name: Prepare database from recorded fixtures
        working-directory: api
        env:
          ENVIRONMENT: local
          DATABASE_URL: sqlite+aiosqlite:///./overtake.db
          SECRET_KEY: ci-secret-key-that-is-long-enough-for-validation
          EMAIL_ENABLED: "false"
          BILLING_ENABLED: "false"
        run: |
          alembic upgrade head
          python ../scripts/seed_e2e.py

      - name: Start the API
        working-directory: api
        env:
          ENVIRONMENT: local
          DATABASE_URL: sqlite+aiosqlite:///./overtake.db
          SECRET_KEY: ci-secret-key-that-is-long-enough-for-validation
          EMAIL_ENABLED: "false"
          BILLING_ENABLED: "false"
        run: |
          uvicorn overtake.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done

      - name: Build and start the web app
        working-directory: web
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Run the journeys
        working-directory: web
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
          E2E_LEAGUE_ID: "555001"
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

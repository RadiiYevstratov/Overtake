# Dependabot keeps the three dependency surfaces patched. CI already runs
# pip-audit and npm audit on every PR, so a Dependabot bump lands with the same
# gate as any other change — nothing auto-merges.
#
# Grouping keeps the PR volume sane: routine minor/patch bumps arrive as one PR
# per ecosystem per week, while a major bump comes on its own so it gets read.
version: 2

updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels: ["dependencies", "api"]
    groups:
      api-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels: ["dependencies", "web"]
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]
